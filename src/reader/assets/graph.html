<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {  /* light; dark below, from the OS or the toggle */
    --surface: #fcfcfb; --panel: #f3f2ee; --hair: rgba(11,11,11,0.10);
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --critical: #d03b3b; --unknown: #a3a29b; --link: 82,81,78;
  }
  :root[data-theme=dark] {
    --surface: #1a1a19; --panel: #222220; --hair: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --critical: #d03b3b; --unknown: #5f5e5a; --link: 200,199,190;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
    --surface: #1a1a19; --panel: #222220; --hair: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --critical: #d03b3b; --unknown: #5f5e5a; --link: 200,199,190;
  } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
  #graph { position: fixed; inset: 0; }
  .bar { position: fixed; top: 12px; left: 12px; display: flex; gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 10px; }
  .bar button { background: none; border: 0; color: var(--ink-2); font-size: 15px; cursor: pointer; padding: 0 2px; }
  .bar input[type=search] { background: transparent; border: 0; outline: 0; color: var(--ink);
    font: inherit; width: 220px; }
  .bar label { color: var(--ink-2); display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .bar .count { color: var(--muted); white-space: nowrap; }
  .legend { position: fixed; left: 12px; bottom: 12px; background: var(--panel);
    border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; color: var(--ink-2);
    display: grid; grid-template-columns: auto auto; gap: 4px 8px; align-items: center; }
  .ramp { width: 90px; height: 8px; border-radius: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; justify-self: center; }
  .ramp-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; background: var(--panel);
    border-left: 1px solid var(--hair); padding: 18px 20px; overflow-y: auto;
    transform: translateX(100%); transition: transform .18s ease; }
  #panel.open { transform: none; }
  #panel h2 { font-size: 16px; margin: 0 0 2px; font-weight: 600; }
  #panel .id { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  #panel .stats { display: flex; gap: 14px; margin: 12px 0; color: var(--ink-2); }
  #panel .stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  #panel .statement { margin: 10px 0 14px; font-size: 14px; }
  #panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 16px 0 6px; font-weight: 600; }
  #panel ul { list-style: none; margin: 0; padding: 0; }
  #panel li { padding: 4px 0; border-top: 1px solid var(--hair); color: var(--ink-2); }
  #panel li:first-child { border-top: 0; }
  #panel a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--muted);
    cursor: pointer; }
  #panel .grade { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink); }
  #panel .mis { color: var(--critical); }
  #panel .close { position: absolute; top: 10px; right: 12px; background: none; border: 0;
    color: var(--muted); font-size: 18px; cursor: pointer; }
  .float-tooltip-kap { background: var(--panel) !important; color: var(--ink) !important;
    border: 1px solid var(--hair); border-radius: 6px !important; font: 12px/1.4 ui-sans-serif,
    system-ui, sans-serif !important; padding: 5px 8px !important; max-width: 320px; }
</style>
</head>
<body>
<div id="graph"></div>
<div class="bar">
  <input type="search" id="q" placeholder="Search…" autocomplete="off">
  <label><input type="checkbox" id="orphans" checked> unconnected</label>
  <span class="count" id="count"></span>
  <button id="theme" title="light / dark">◐</button>
</div>
<div class="legend">
  <div><div class="ramp" id="ramp"></div><div class="ramp-ends"><span>R 0</span><span>1</span></div></div>
  <span>recall today</span>
  <span class="dot" style="background:var(--unknown)"></span><span>never asked</span>
  <span class="dot" style="border:2px solid var(--critical)"></span><span>last answer a misconception</span>
  <span class="dot" style="border:2px solid var(--ink)"></span><span>looked up</span>
  <span style="color:var(--muted);text-align:center">&gt;–</span><span>chain: premises → conclusion</span>
</div>
<aside id="panel"><button class="close" id="close">×</button><div id="body"></div></aside>

<script>/*{{force-graph}}*/</script>
<script>
const DATA = /*{{data}}*/;

// R → one blue ramp, faint to strong against the surface (validated steps:
// light 250 … 700, dark 600 … 100), so well-held ideas stand out in both modes
const RAMPS = {
  light: ["#86b6ef","#6da7ec","#5598e7","#3987e5","#2a78d6","#256abf","#1c5cab","#184f95",
          "#104281","#0d366b"],
  dark: ["#184f95","#1c5cab","#256abf","#2a78d6","#3987e5","#5598e7","#6da7ec","#86b6ef",
         "#9ec5f4","#b7d3f6","#cde2fb"],
};
const dark = matchMedia("(prefers-color-scheme: dark)");
let T = {}, RAMP = [];
function theme() {
  const set = localStorage.getItem("reader-theme");
  if (set) document.documentElement.dataset.theme = set;
  else delete document.documentElement.dataset.theme;
  const mode = set || (dark.matches ? "dark" : "light");
  const css = getComputedStyle(document.documentElement);
  for (const k of ["surface", "ink", "ink-2", "critical", "unknown", "link"])
    T[k] = css.getPropertyValue("--" + k).trim();
  RAMP = RAMPS[mode];
  document.getElementById("ramp").style.background = `linear-gradient(90deg, ${RAMP.join(",")})`;
  if (window.G) G.backgroundColor(T.surface);
}
theme();
dark.addEventListener("change", theme);
document.getElementById("theme").onclick = () => {
  const now = document.documentElement.dataset.theme || (dark.matches ? "dark" : "light");
  localStorage.setItem("reader-theme", now === "dark" ? "light" : "dark");
  theme();
};
const C = k => T[k.replace(/^--/, "")];
const colourOf = r => r == null ? T.unknown
  : RAMP[Math.round(Math.max(0, Math.min(1, r)) * (RAMP.length - 1))];

const fmtR = r => r == null ? "–" : r >= 1 ? "1" : r.toFixed(2).replace(/^0/, "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const idOf = x => typeof x === "object" ? x.id : x;

// chains each node takes part in, and the members of each chain
const chainsOf = {}, members = {};
for (const [cid, c] of Object.entries(DATA.chains)) {
  members[cid] = new Set([...c.premises, c.conclusion, cid]);
  for (const id of members[cid]) (chainsOf[id] ??= new Set()).add(cid);
}
const degree = id => (chainsOf[id]?.size ?? 0);
const props = Object.fromEntries(DATA.nodes.filter(n => !n.knot).map(n => [n.id, n]));

let lit = null;      // ids lit by hover or search; null: everything
let litChains = null;
let selected = null;

function light(ids) {
  if (!ids || !ids.size) { lit = litChains = null; return; }
  lit = new Set(ids); litChains = new Set();
  for (const id of ids) for (const cid of chainsOf[id] ?? []) {
    litChains.add(cid); for (const m of members[cid]) lit.add(m);
  }
}
const dim = id => lit && !lit.has(id);

const el = document.getElementById("graph");
const G = window.G = ForceGraph()(el)
  .backgroundColor(C("--surface"))
  .nodeId("id")
  .nodeRelSize(3.2)
  .nodeVal(n => n.knot ? 0.05 : 1 + 1.5 * degree(n.id))
  .nodeLabel(n => n.knot
      ? `<b>${esc(DATA.chains[n.chain].name)}</b><br>${esc(DATA.chains[n.chain].step)}`
      : `<b>${esc(n.name)}</b> · R ${fmtR(n.r)}`)
  .linkLabel(l => `<b>${esc(DATA.chains[l.chain].name)}</b><br>${esc(DATA.chains[l.chain].step)}`
      + ` · R ${fmtR(DATA.chains[l.chain].r)}`)
  .linkColor(l => {
    const c = DATA.chains[l.chain];
    const a = litChains && !litChains.has(l.chain) ? 0.05 : litChains ? 0.75 : 0.28;
    return c.r == null ? `rgba(${T.link},${a})` : hexA(colourOf(c.r), a + 0.15);
  })
  .linkWidth(l => litChains?.has(l.chain) ? 1.6 : 1)
  .linkDirectionalArrowLength(l => l.arrow ? 3.5 : 0)
  .linkDirectionalArrowRelPos(1)
  .nodeCanvasObject(draw)
  .nodePointerAreaPaint((n, colour, ctx) => {
    ctx.fillStyle = colour; ctx.beginPath();
    ctx.arc(n.x, n.y, (n.knot ? 3 : radius(n) + 2), 0, 2 * Math.PI); ctx.fill();
  })
  .onNodeHover(n => { if (!q.value) light(n ? new Set([n.id]) : null); el.style.cursor = n ? "pointer" : null; })
  .onLinkHover(l => { if (!q.value) { lit = l ? new Set(members[l.chain]) : null; litChains = l ? new Set([l.chain]) : null; } })
  .onNodeClick(n => open(n.knot ? n.chain : n.id))
  .onLinkClick(l => open(l.chain))
  .onBackgroundClick(() => close())
  .cooldownTicks(300)
  .autoPauseRedraw(false)  // search, theme and hover change the drawing after the layout settles
  .onEngineStop(() => { if (!G._fitted) { G._fitted = true; G.zoomToFit(400, 60);
    setTimeout(() => { if (G.zoom() > 2.5) G.zoom(2.5, 300); }, 420); } });  // small views stay small

G.d3Force("charge").strength(n => n.knot ? -8 : -70);
// a gentle pull to the centre, as in Obsidian, so unconnected ideas stay near
G.d3Force("gravity", (() => { let ns = []; const f = alpha => {
  for (const n of ns) { n.vx -= n.x * 0.04 * alpha; n.vy -= n.y * 0.04 * alpha; } };
  f.initialize = nodes => { ns = nodes; }; return f; })());
G.d3Force("link").distance(l => l.arrow && idOf(l.source) in DATA.chains ? 30 : l.arrow ? 55 : 22);

function hexA(hex, a) {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${Math.min(1, a)})`;
}
function radius(n) { return Math.sqrt(1 + 1.5 * degree(n.id)) * 3.2; }

function draw(n, ctx, scale) {
  const faded = dim(n.id);
  ctx.globalAlpha = faded ? 0.12 : 1;
  if (n.knot) {
    const c = DATA.chains[n.chain];
    ctx.fillStyle = c.r == null ? `rgba(${T.link},0.6)` : colourOf(c.r);
    ctx.beginPath(); ctx.arc(n.x, n.y, 1.3, 0, 2 * Math.PI); ctx.fill();
    ctx.globalAlpha = 1; return;
  }
  const r = radius(n);
  ctx.fillStyle = colourOf(n.r);
  ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2 * Math.PI); ctx.fill();
  const ring = (colour, w, gap) => { ctx.strokeStyle = colour; ctx.lineWidth = w / scale;
    ctx.beginPath(); ctx.arc(n.x, n.y, r + gap / scale, 0, 2 * Math.PI); ctx.stroke(); };
  if (n.mis) ring(C("--critical"), 2, 1.5);
  if (n.focus || n.id === selected) ring(C("--ink"), 1.5, n.mis ? 4 : 1.5);
  // labels fade in as you zoom, like Obsidian; lit nodes always show theirs
  const shown = lit ? lit.has(n.id) : false;
  const a = shown ? 1 : Math.max(0, Math.min(1, (scale - 1.1) / 1.2));
  if (a > 0 && !faded) {
    ctx.globalAlpha = a;
    ctx.font = `${12 / scale}px ui-sans-serif, system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillStyle = shown ? C("--ink") : C("--ink-2");
    ctx.fillText(n.name, n.x, n.y + r + 3 / scale);
  }
  ctx.globalAlpha = 1;
}

// -- data, with or without unconnected propositions
const q = document.getElementById("q");
function load() {
  const keep = document.getElementById("orphans").checked;
  const nodes = DATA.nodes.filter(n => keep || n.knot || degree(n.id) > 0);
  G.graphData({ nodes: nodes.map(n => ({ ...n })), links: DATA.links.map(l => ({ ...l })) });
  const np = nodes.filter(n => !n.knot).length, nc = Object.keys(DATA.chains).length;
  document.getElementById("count").textContent = `${np} propositions · ${nc} chains · ${DATA.today}`;
}
document.getElementById("orphans").onchange = () => { G._fitted = false; load(); };
load();

// -- search lights matches and their chains; Enter centres on the first
const hay = n => [n.id, n.name, n.statement, ...(n.topics || [])].join(" ").toLowerCase();
q.oninput = () => {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = words.length ? Object.values(props).filter(n => words.every(w => hay(n).includes(w))) : [];
  light(words.length ? new Set(hits.map(n => n.id).concat(hits.length ? [] : ["-"])) : null);
};
q.onkeydown = e => {
  if (e.key === "Enter" && lit) {
    const n = G.graphData().nodes.find(n => lit.has(n.id) && !n.knot);
    if (n) { G.centerAt(n.x, n.y, 500); G.zoom(3, 500); open(n.id); }
  }
  if (e.key === "Escape") { q.value = ""; light(null); }
};

// -- the side panel
const panel = document.getElementById("panel"), body = document.getElementById("body");
document.getElementById("close").onclick = close;
function close() { selected = null; panel.classList.remove("open"); }
const link = id => `<a data-id="${id}">${esc(props[id]?.name ?? DATA.chains[id]?.name ?? id)}</a>`;
body.onclick = e => { const id = e.target.dataset?.id; if (id) open(id, true); };

function answers(list) {
  if (!list.length) return `<p style="color:var(--muted)">No answers yet.</p>`;
  return `<ul>${list.slice().reverse().map(a =>
    `<li><span class="grade">${a.day} ${esc(a.grade)}${a.conf != null ? " · " + a.conf : ""}</span>
     ${a.flag === "mis" ? '<span class="mis">misconception</span>' : a.flag === "unseen" ? "never met" : ""}
     <span class="id">${esc(a.kind)} ${esc(a.ask)}</span><br>${esc(a.note)}</li>`).join("")}</ul>`;
}
function stats(x) {
  const s = x.stability == null ? "–" : x.stability < 10 ? x.stability.toFixed(1) : Math.round(x.stability);
  return `<div class="stats"><span>R <b>${fmtR(x.r)}</b></span><span>stability <b>${s}</b> d</span>
          <span>answers <b>${x.n}</b></span></div>`;
}

function open(id, centre) {
  const c = DATA.chains[id], p = props[id];
  if (!c && !p) return;
  selected = id;
  if (p) {
    const into = [...(chainsOf[id] ?? [])].filter(k => DATA.chains[k].conclusion === id);
    const out = [...(chainsOf[id] ?? [])].filter(k => DATA.chains[k].premises.includes(id));
    body.innerHTML = `<h2>${esc(p.name)}</h2><div class="id">${p.id}${p.topics.length ? " · #" + p.topics.map(esc).join(" #") : ""}${p.vault ? " · vault " + esc(p.vault) : ""}</div>
      ${stats(p)}<div class="statement">${esc(p.statement)}</div>
      ${into.length ? `<h3>Rests on</h3><ul>${into.map(k => `<li>${DATA.chains[k].premises.map(link).join(" ∧ ")}<br><span class="id">${link(k)} · R ${fmtR(DATA.chains[k].r)}</span></li>`).join("")}</ul>` : ""}
      ${out.length ? `<h3>Rests on it</h3><ul>${out.map(k => `<li>${link(DATA.chains[k].conclusion)}<br><span class="id">${link(k)} · R ${fmtR(DATA.chains[k].r)}</span></li>`).join("")}</ul>` : ""}
      <h3>Answers</h3>${answers(p.answers)}`;
  } else {
    body.innerHTML = `<h2>${c.premises.map(link).join(" ∧ ")} ⟹ ${link(c.conclusion)}</h2>
      <div class="id">${c.id} · chain</div>${stats(c)}
      <div class="statement">${esc(c.step)}</div><h3>Answers</h3>${answers(c.answers)}`;
  }
  panel.classList.add("open");
  window.renderMathInElement?.(body, { delimiters: [{ left: "$$", right: "$$", display: true },
    { left: "$", right: "$", display: false }], throwOnError: false });
  if (centre) {
    const n = G.graphData().nodes.find(n => n.id === id || n.chain === id);
    if (n) G.centerAt(n.x, n.y, 500);
  }
}

// a single lookup opens on its match
const focused = Object.values(props).filter(n => n.focus);
if (focused.length === 1) setTimeout(() => open(focused[0].id), 50);
addEventListener("resize", () => G.width(innerWidth).height(innerHeight));
</script>
</body>
</html>
