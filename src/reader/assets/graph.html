<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {  /* light; dark below, from the OS or the toggle */
    --surface: #fcfcfb; --panel: #f3f2ee; --hair: rgba(11,11,11,0.10);
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --critical: #d03b3b; --unknown: #a3a29b; --link: 82,81,78;
  }
  :root[data-theme=dark] {
    --surface: #1a1a19; --panel: #222220; --hair: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --critical: #d03b3b; --unknown: #5f5e5a; --link: 200,199,190;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
    --surface: #1a1a19; --panel: #222220; --hair: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --critical: #d03b3b; --unknown: #5f5e5a; --link: 200,199,190;
  } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
  #graph { position: fixed; inset: 0; }
  .bar { position: fixed; top: 12px; left: 12px; display: flex; gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 10px; }
  .bar button { background: none; border: 0; color: var(--ink-2); font-size: 15px; cursor: pointer; padding: 0 2px; }
  .bar button:hover { color: var(--ink); }
  .bar button[hidden] { display: none; }
  .bar input[type=search] { background: transparent; border: 0; outline: 0; color: var(--ink);
    font: inherit; width: 220px; }
  .bar label { color: var(--ink-2); display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .bar .count { color: var(--muted); white-space: nowrap; }
  .legend { position: fixed; left: 12px; bottom: 12px; background: var(--panel);
    border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; color: var(--ink-2);
    display: grid; grid-template-columns: auto auto; gap: 4px 8px; align-items: center; }
  .ramp { width: 120px; height: 8px; border-radius: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; justify-self: center; }
  .ramp-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; background: var(--panel);
    border-left: 1px solid var(--hair); padding: 18px 20px; overflow-y: auto;
    transform: translateX(100%); transition: transform .18s ease; }
  #panel.open { transform: none; }
  #panel h2 { font-size: 16px; margin: 0 0 2px; font-weight: 600; }
  #panel .id { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  #panel .stats { display: flex; gap: 14px; margin: 12px 0; color: var(--ink-2); }
  #panel .stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  #panel .statement { margin: 10px 0 14px; font-size: 14px; }
  #panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 16px 0 6px; font-weight: 600; }
  #panel ul { list-style: none; margin: 0; padding: 0; }
  #panel li { padding: 4px 0; border-top: 1px solid var(--hair); color: var(--ink-2); }
  #panel li:first-child { border-top: 0; }
  #panel a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--muted);
    cursor: pointer; }
  #panel .grade { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink); }
  #panel .mis { color: var(--critical); }
  #panel .close { position: absolute; top: 10px; right: 12px; background: none; border: 0;
    color: var(--muted); font-size: 18px; cursor: pointer; }
  .float-tooltip-kap { background: var(--panel) !important; color: var(--ink) !important;
    border: 1px solid var(--hair); border-radius: 6px !important; font: 12px/1.4 ui-sans-serif,
    system-ui, sans-serif !important; padding: 5px 8px !important; max-width: 320px; }
</style>
</head>
<body>
<div id="graph"></div>
<div class="bar">
  <input type="search" id="q" placeholder="Search…" autocomplete="off">
  <label><input type="checkbox" id="orphans" checked> unconnected</label>
  <label><input type="checkbox" id="shade" checked> areas</label>
  <span class="count" id="count"></span>
  <button id="refresh" title="refresh from the model (r)" hidden>↻</button>
  <button id="theme" title="light / dark">◐</button>
</div>
<div class="legend">
  <div><div class="ramp" id="ramp"></div><div class="ramp-ends"><span>R 0</span><span>.5</span><span>1</span></div></div>
  <span>recall now</span>
  <span class="dot" style="background:var(--unknown)"></span><span>never asked</span>
  <span class="dot" style="border:2px solid var(--critical)"></span><span>last answer a misconception</span>
  <span class="dot" style="border:2px solid var(--ink)"></span><span>looked up</span>
  <svg width="22" height="10"><line x1="1" y1="5" x2="15" y2="5" stroke="var(--muted)" stroke-width="1.5"/><path d="M14 1 L21 5 L14 9 Z" fill="var(--muted)"/></svg><span>needs: the arrow points to the idea that cannot be followed without it</span>
  <svg width="22" height="10"><line x1="1" y1="5" x2="15" y2="5" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M14 1 L21 5 L14 9 Z" fill="var(--muted)"/></svg><span>uses only: the idea it points to carries it out</span>
  <span class="dot" style="border-radius:3px;background:var(--hair)"></span><span>shading: an area, and the areas inside it</span>
</div>
<aside id="panel"><button class="close" id="close">×</button><div id="body"></div></aside>

<script>/*{{force-graph}}*/</script>
<script>
const DATA = /*{{data}}*/;

// a refresh reloads the page, which the server builds afresh from the model;
// the layout, view, search and open panel are carried across in sessionStorage
const KEPT = (() => { try { return JSON.parse(sessionStorage.getItem("reader-kept")); }
                      catch { return null; } finally { sessionStorage.removeItem("reader-kept"); } })();

// R → an ochre → green → teal → blue ramp, faint to strong against the surface.
// Half of it goes to R .5–.7 and .7–1 each, where the distinctions matter, so
// .8, .9 and .95 read as different hues as well as lightnesses. Stops are
// OKLCH [R, L, C, h], blended in OKLab; lightness is monotone, so order
// survives colour-blindness and greyscale.
const STOPS = {
  light: [[0, .78, .09, 85], [.5, .74, .13, 125], [.7, .65, .12, 165], [.8, .59, .10, 195],
          [.9, .51, .11, 240], [1, .39, .13, 275]],
  dark: [[0, .42, .07, 85], [.5, .52, .11, 125], [.7, .62, .12, 165], [.8, .69, .10, 195],
         [.9, .78, .095, 235], [1, .87, .065, 280]],
};
function oklab(stops, r) {
  let i = 0; while (i < stops.length - 2 && r > stops[i + 1][0]) i++;
  const [r0, ...p] = stops[i], [r1, ...q] = stops[i + 1], t = (r - r0) / (r1 - r0);
  const ab = ([L, C, h]) => [L, C * Math.cos(h * Math.PI / 180), C * Math.sin(h * Math.PI / 180)];
  const A = ab(p), B = ab(q);
  return A.map((v, k) => v + (B[k] - v) * t);
}
function hex([L, a, b]) {
  const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3,
        s = (L - .0894841775 * a - 1.2914855480 * b) ** 3;
  return "#" + [4.0767416621 * l - 3.3077115913 * m + .2309699292 * s,
                -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s,
                -.0041960863 * l - .7034186147 * m + 1.7076147010 * s].map(v => {
    v = Math.max(0, Math.min(1, v)); v = v <= .0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - .055;
    return Math.round(v * 255).toString(16).padStart(2, "0"); }).join("");
}
const dark = matchMedia("(prefers-color-scheme: dark)");
let T = {}, RAMP = [];
function theme() {
  const set = localStorage.getItem("reader-theme");
  if (set) document.documentElement.dataset.theme = set;
  else delete document.documentElement.dataset.theme;
  const mode = T.mode = set || (dark.matches ? "dark" : "light");
  const css = getComputedStyle(document.documentElement);
  for (const k of ["surface", "ink", "ink-2", "critical", "unknown", "link"])
    T[k] = css.getPropertyValue("--" + k).trim();
  RAMP = Array.from({ length: 101 }, (_, i) => hex(oklab(STOPS[mode], i / 100)));  // R in hundredths
  document.getElementById("ramp").style.background =
    `linear-gradient(90deg, ${RAMP.filter((_, i) => i % 5 === 0).join(",")})`;
  if (window.G) G.backgroundColor(T.surface);
}
theme();
dark.addEventListener("change", theme);
document.getElementById("theme").onclick = () => {
  const now = document.documentElement.dataset.theme || (dark.matches ? "dark" : "light");
  localStorage.setItem("reader-theme", now === "dark" ? "light" : "dark");
  theme();
};
const C = k => T[k.replace(/^--/, "")];
const colourOf = r => r == null ? T.unknown : RAMP[Math.round(Math.max(0, Math.min(1, r)) * 100)];

const fmtR = r => r == null ? "–" : r >= 1 ? "1" : (Math.floor(r * 100) / 100).toFixed(2).replace(/^0/, "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const idOf = x => typeof x === "object" ? x.id : x;

// links run from the idea needed or used to the idea that needs or uses it, so
// what an idea rests on sits above it
const ideas = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const nbrs = {};
for (const l of DATA.links) {
  (nbrs[l.source] ??= new Set()).add(l.target); (nbrs[l.target] ??= new Set()).add(l.source);
}
const degree = id => (nbrs[id]?.size ?? 0);
const markOf = l => l.needs && l.uses ? "needs and uses" : l.needs ? "needs" : "uses";

// -- areas: every area, and each area above it, is a shaded region behind its
// ideas; nested areas stack, so a subarea reads darker inside its parent
const chain = a => a.split("/").map((_, i, p) => p.slice(0, i + 1).join("/"));
const AREAS = [...new Set(DATA.nodes.flatMap(n => chain(n.area)))]
  .sort((a, b) => a.split("/").length - b.split("/").length || a.localeCompare(b));
const TOPS = [...new Set(AREAS.map(a => a.split("/")[0]))];
function areaColour(a, alpha, ink) {
  const h = (25 + 360 * TOPS.indexOf(a.split("/")[0]) / TOPS.length) * Math.PI / 180;
  const [L, C] = ink ? (T.mode === "dark" ? [.78, .09] : [.48, .1]) : (T.mode === "dark" ? [.62, .08] : [.7, .1]);
  return hexA(hex([L, C * Math.cos(h), C * Math.sin(h)]), alpha);
}
function hull(pts) {  // monotone chain
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const x = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length > 1 && x(lo.at(-2), lo.at(-1), p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()) { while (up.length > 1 && x(up.at(-2), up.at(-1), p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
const RING = Array.from({ length: 12 }, (_, i) => [Math.cos(i * Math.PI / 6), Math.sin(i * Math.PI / 6)]);
function shadeAreas(ctx, scale) {
  if (!document.getElementById("shade").checked) return;
  const ns = G.graphData().nodes.filter(n => n.x != null);
  for (const a of AREAS) {
    const inside = ns.filter(n => n.area === a || n.area.startsWith(a + "/"));
    if (!inside.length) continue;
    const level = a.split("/").length - 1, pad = Math.max(10, 30 - 8 * level);
    const h = hull(inside.flatMap(n => RING.map(([c, s]) => [n.x + pad * c, n.y + pad * s])));
    ctx.beginPath();  // round the corners through the edge midpoints
    const mid = i => { const p = h[i % h.length], q = h[(i + 1) % h.length];
      return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; };
    ctx.moveTo(...mid(h.length - 1));
    h.forEach((p, i) => ctx.quadraticCurveTo(p[0], p[1], ...mid(i)));
    ctx.closePath();
    ctx.fillStyle = areaColour(a, T.mode === "dark" ? .11 : .10);
    ctx.fill();
    // the name sits on the region's top edge; subareas' names fade in with zoom
    const a2 = level === 0 ? 0.9 : Math.max(0, Math.min(0.9, (scale - 0.7) / 0.6));
    if (a2 > 0) {
      const top = h.reduce((m, p) => p[1] < m[1] ? p : m);
      const xs = h.filter(p => p[1] < top[1] + 4 / scale).map(p => p[0]);
      ctx.font = `${level === 0 ? 600 : 500} ${(level === 0 ? 13 : 11) / scale}px ui-sans-serif, system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillStyle = areaColour(a, a2, true);
      ctx.fillText(level === 0 ? a : a.split("/").at(-1),
                   (Math.min(...xs) + Math.max(...xs)) / 2, top[1] - 2 / scale);
    }
  }
}

let lit = null;      // ids lit by hover or search; null: everything
let selected = null;

function light(ids) {
  if (!ids || !ids.size) { lit = null; return; }
  lit = new Set(ids);
  for (const id of ids) for (const m of nbrs[id] ?? []) lit.add(m);
}
const dim = id => lit && !lit.has(id);
const litLink = l => lit && lit.has(idOf(l.source)) && lit.has(idOf(l.target));

const el = document.getElementById("graph");
const G = window.G = ForceGraph()(el)
  .backgroundColor(C("--surface"))
  .nodeId("id")
  .nodeRelSize(3.2)
  .nodeVal(n => 1 + 1.5 * degree(n.id))
  .nodeLabel(n => `<b>${esc(n.name)}</b> · ${esc(n.kind)} · R ${fmtR(n.r)}`)
  .linkLabel(l => `<b>${esc(ideas[idOf(l.target)]?.name)}</b> ${markOf(l)} <b>${esc(ideas[idOf(l.source)]?.name)}</b>`)
  .linkColor(l => `rgba(${T.link},${lit ? (litLink(l) ? 0.8 : 0.05) : 0.32})`)
  .linkWidth(l => (l.needs && l.uses ? 1.6 : 1) * (litLink(l) ? 1.5 : 1))
  .linkLineDash(l => l.needs ? null : [3, 2])
  .linkDirectionalArrowLength(l => litLink(l) ? 7 : 5.5)
  .linkDirectionalArrowRelPos(0.55)
  .linkDirectionalParticles(l => litLink(l) ? 2 : 0)  // lit edges flow toward what rests on them
  .linkDirectionalParticleWidth(2.5)
  .linkDirectionalParticleSpeed(0.006)
  .onRenderFramePre(shadeAreas)
  .nodeCanvasObject(draw)
  .nodePointerAreaPaint((n, colour, ctx) => {
    ctx.fillStyle = colour; ctx.beginPath();
    ctx.arc(n.x, n.y, radius(n) + 2, 0, 2 * Math.PI); ctx.fill();
  })
  .onNodeHover(n => { if (!q.value) light(n ? new Set([n.id]) : null); el.style.cursor = n ? "pointer" : null; })
  .onLinkHover(l => { if (!q.value) lit = l ? new Set([idOf(l.source), idOf(l.target)]) : null; })
  .onNodeClick(n => open(n.id))
  .onLinkClick(l => open(idOf(l.target)))
  .onBackgroundClick(() => close())
  .cooldownTicks(300)
  .autoPauseRedraw(false)  // search, theme and hover change the drawing after the layout settles
  .onEngineStop(() => { if (!G._fitted) { G._fitted = true; G.zoomToFit(400, 60);
    setTimeout(() => { if (G.zoom() > 2.5) G.zoom(2.5, 300); }, 420); } });  // small views stay small

G.d3Force("charge").strength(-70);
// a gentle pull to the centre, as in Obsidian, so unconnected ideas stay near
G.d3Force("gravity", (() => { let ns = []; const f = alpha => {
  for (const n of ns) { n.vx -= n.x * 0.04 * alpha; n.vy -= n.y * 0.04 * alpha; } };
  f.initialize = nodes => { ns = nodes; }; return f; })());
// what an idea rests on sits above it. Each idea gets a depth, the longest path
// of edges into it (an idea that rests on nothing sits just above the nearest
// idea resting on it), and is pulled gently to that row; each link also nudges
// its target below its source. All soft, so a cycle stays a tangle instead of
// breaking the layout.
const depth = (() => {
  const d = {}, ls = DATA.links, n = DATA.nodes.length;
  for (const l of ls) { d[l.source] ??= 0; d[l.target] ??= 0; }
  for (let i = 0, moved = true; moved && i < n; i++) {
    moved = false;
    for (const l of ls) if (d[l.target] < d[l.source] + 1) { d[l.target] = d[l.source] + 1; moved = true; }
  }
  for (const id of Object.keys(d))
    if (!ls.some(l => l.target === id))
      d[id] = Math.max(d[id], Math.min(...ls.filter(l => l.source === id).map(l => d[l.target])) - 1);
  return d;
})();
// rows are relative to each connected component, so components keep apart
const comp = {};
for (const id of Object.keys(depth)) {
  if (id in comp) continue;
  const stack = [id]; comp[id] = id;
  while (stack.length) for (const m of nbrs[stack.pop()] ?? [])
    if (!(m in comp)) { comp[m] = id; stack.push(m); }
}
const ROW = 42;
// each component starts in its own place, biggest in the middle, already in
// row order, and is held together loosely: started tangled, a force layout
// never pulls components apart again
// Components start near their area: top areas on a circle, their subareas
// around them, and each component on a small spiral round its area's spot.
const anchor = (() => {
  const at = {}, R0 = 230 * Math.sqrt(TOPS.length);
  TOPS.forEach((t, i) => { const a = 2 * Math.PI * i / TOPS.length;
    at[t] = [R0 * Math.cos(a), R0 * Math.sin(a)]; });
  for (const a of AREAS) {
    if (a in at) continue;
    const parent = a.slice(0, a.lastIndexOf("/")), sibs = AREAS.filter(b =>
      b.slice(0, b.lastIndexOf("/")) === parent && b.split("/").length === a.split("/").length);
    const k = sibs.indexOf(a), ang = 2 * Math.PI * k / sibs.length, r = 110 / (a.split("/").length - 1);
    at[a] = [at[parent][0] + r * Math.cos(ang), at[parent][1] + r * Math.sin(ang)];
  }
  return at;
})();
const home = (() => {
  const by = {};
  for (const [id, c] of Object.entries(comp)) (by[c] ??= []).push(id);
  const order = Object.values(by).sort((a, b) => b.length - a.length);
  const at = {}, placed = {};
  for (const ids of order) {
    const count = {};  // the component's most common area
    for (const id of ids) count[ideas[id].area] = (count[ideas[id].area] ?? 0) + 1;
    const area = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
    const i = placed[area] = (placed[area] ?? -1) + 1;
    const a = i * 2.39996, r = 60 * Math.sqrt(i);  // golden-angle spiral
    const [cx, cy] = anchor[area];
    const mean = ids.reduce((s, id) => s + depth[id], 0) / ids.length;
    ids.forEach((id, j) => at[id] = [cx + r * Math.cos(a) + ((j * 37) % 60 - 30),
                                      cy + r * Math.sin(a) + (depth[id] - mean) * ROW]);
  }
  for (const n of DATA.nodes) if (!(n.id in at)) {  // unconnected ideas start at their area
    const i = placed[n.area] = (placed[n.area] ?? -1) + 1, a = i * 2.39996, r = 60 * Math.sqrt(i);
    at[n.id] = [anchor[n.area][0] + r * Math.cos(a), anchor[n.area][1] + r * Math.sin(a)];
  }
  return at;
})();
// each idea is pulled toward its area's spot, and softly toward the middle of
// its area and of every area above it, more sideways than up and down, so
// areas stay together and apart without flattening the rows
G.d3Force("areas", alpha => {
  const ns = G.graphData().nodes, mid = {};
  for (const n of ns) for (const a of chain(n.area)) {
    const s = mid[a] ??= [0, 0, 0]; s[0] += n.x; s[1] += n.y; s[2]++; }
  for (const n of ns) {
    const [ax, ay] = anchor[n.area];
    n.vx += (ax - n.x) * 0.03 * alpha; n.vy += (ay - n.y) * 0.012 * alpha;
    chain(n.area).forEach((a, i) => {
      const [x, y, k] = mid[a], w = (0.04 + 0.02 * i) * alpha;
      n.vx += (x / k - n.x) * w; n.vy += (y / k - n.y) * w * 0.4;
    });
  }
});
G.d3Force("layers", alpha => {
  const sum = {};  // per component: mean x, mean y and mean depth of the nodes shown
  const ns = G.graphData().nodes.filter(n => n.id in depth);
  for (const n of ns) { const s = sum[comp[n.id]] ??= [0, 0, 0, 0];
    s[0] += n.x; s[1] += n.y; s[2] += depth[n.id]; s[3]++; }
  for (const n of ns) { const [x, y, d, k] = sum[comp[n.id]];
    n.vx += (x / k - n.x) * 0.03 * alpha;
    n.vy += (y / k + (depth[n.id] - d / k) * ROW - n.y) * 0.12 * alpha; }
});
G.d3Force("flow", alpha => {
  for (const l of G.graphData().links) {
    const s = l.source, t = l.target;
    if (typeof s !== "object") continue;  // not yet resolved by the link force
    const short = 34 - (t.y - s.y);
    if (short > 0) { const k = short * 0.12 * alpha; t.vy += k; s.vy -= k; }
  }
});
G.d3Force("link").distance(55);

function hexA(hex, a) {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${Math.min(1, a)})`;
}
function radius(n) { return Math.sqrt(1 + 1.5 * degree(n.id)) * 3.2; }

function draw(n, ctx, scale) {
  const faded = dim(n.id);
  ctx.globalAlpha = faded ? 0.12 : 1;
  const r = radius(n);
  ctx.fillStyle = colourOf(n.r);
  ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2 * Math.PI); ctx.fill();
  const ring = (colour, w, gap) => { ctx.strokeStyle = colour; ctx.lineWidth = w / scale;
    ctx.beginPath(); ctx.arc(n.x, n.y, r + gap / scale, 0, 2 * Math.PI); ctx.stroke(); };
  if (n.mis) ring(C("--critical"), 2, 1.5);
  if (n.focus || n.id === selected) ring(C("--ink"), 1.5, n.mis ? 4 : 1.5);
  // labels fade in as you zoom, like Obsidian; lit nodes always show theirs
  const shown = lit ? lit.has(n.id) : false;
  const a = shown ? 1 : Math.max(0, Math.min(1, (scale - 1.1) / 1.2));
  if (a > 0 && !faded) {
    ctx.globalAlpha = a;
    ctx.font = `${12 / scale}px ui-sans-serif, system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillStyle = shown ? C("--ink") : C("--ink-2");
    ctx.fillText(n.name, n.x, n.y + r + 3 / scale);
  }
  ctx.globalAlpha = 1;
}

// -- data, with or without unconnected propositions
const q = document.getElementById("q");
function load(at = {}) {
  const keep = document.getElementById("orphans").checked;
  const nodes = DATA.nodes.filter(n => keep || degree(n.id) > 0);
  const place = n => at[n.id] ? { ...n, x: at[n.id][0], y: at[n.id][1] }
    : { ...n, x: home[n.id][0], y: home[n.id][1] };
  G.graphData({ nodes: nodes.map(place), links: DATA.links.map(l => ({ ...l })) });
  document.getElementById("count").textContent = `${nodes.length} ideas · ${DATA.links.length} edges · ${DATA.now}`;
}
document.getElementById("orphans").onchange = () => { G._fitted = false; load(); };
document.getElementById("shade").onchange = e => {
  try { localStorage.setItem("reader-shade", e.target.checked ? "1" : "0"); } catch {} };
try { document.getElementById("shade").checked = localStorage.getItem("reader-shade") !== "0"; } catch {}
if (KEPT) {
  document.getElementById("orphans").checked = KEPT.orphans;
  G._fitted = true;  // keep their view rather than zooming to fit
  load(KEPT.at);
  G.centerAt(KEPT.centre.x, KEPT.centre.y); G.zoom(KEPT.zoom);
  G.d3AlphaDecay(0.08);  // already laid out: settle any new nodes without a long drift
} else load();

const refresh = document.getElementById("refresh");
refresh.hidden = !DATA.live;
function reload() {
  if (!DATA.live) return;
  const at = {};
  for (const n of G.graphData().nodes) if (n.x != null) at[n.id] = [n.x, n.y];
  sessionStorage.setItem("reader-kept", JSON.stringify({ at, centre: G.centerAt(),
    zoom: G.zoom(), selected, q: q.value, orphans: document.getElementById("orphans").checked }));
  location.reload();
}
refresh.onclick = reload;
addEventListener("keydown", e => {
  if (e.key === "r" && !e.metaKey && !e.ctrlKey && !e.altKey && e.target.tagName !== "INPUT") reload();
});

// -- search lights matches and their neighbours; Enter centres on the first
const hay = n => [n.id, n.name, n.statement, n.area, ...(n.aliases || [])].join(" ").toLowerCase();
q.oninput = () => {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = words.length ? Object.values(ideas).filter(n => words.every(w => hay(n).includes(w))) : [];
  light(words.length ? new Set(hits.map(n => n.id).concat(hits.length ? [] : ["-"])) : null);
};
q.onkeydown = e => {
  if (e.key === "Enter" && lit) {
    const n = G.graphData().nodes.find(n => lit.has(n.id));
    if (n) { G.centerAt(n.x, n.y, 500); G.zoom(3, 500); open(n.id); }
  }
  if (e.key === "Escape") { q.value = ""; light(null); }
};

// -- the side panel
const panel = document.getElementById("panel"), body = document.getElementById("body");
document.getElementById("close").onclick = close;
function close() { selected = null; panel.classList.remove("open"); }
const link = id => `<a data-id="${id}">${esc(ideas[id]?.name ?? id)}</a>`;
body.onclick = e => { const id = e.target.dataset?.id; if (id) open(id, true); };

function answers(list) {
  if (!list.length) return `<p style="color:var(--muted)">No answers yet.</p>`;
  return `<ul>${list.slice().reverse().map(a =>
    `<li><span class="grade">${a.at} ${esc(a.grade)}${a.conf != null ? " · " + a.conf : ""}</span>
     ${a.flag === "mis" ? '<span class="mis">misconception</span>' : a.flag === "unseen" ? "never met" : ""}
     <span class="id">${esc(a.kind)} ${esc(a.ask)}</span><br>${esc(a.note)}</li>`).join("")}</ul>`;
}
function stats(x) {
  const s = x.stability == null ? "–" : x.stability < 10 ? x.stability.toFixed(1) : Math.round(x.stability);
  return `<div class="stats"><span>R <b>${fmtR(x.r)}</b></span><span>stability <b>${s}</b> d</span>
          <span>answers <b>${x.n}</b></span></div>`;
}

function open(id, centre) {
  const p = ideas[id];
  if (!p) return;
  selected = id;
  const edge = l => `<li>${link(l.other)} <span class="id">${markOf(l)} · R ${fmtR(ideas[l.other]?.r)}</span></li>`;
  const out = DATA.links.filter(l => l.target === id).map(l => ({ ...l, other: l.source }));
  const inn = DATA.links.filter(l => l.source === id).map(l => ({ ...l, other: l.target }));
  body.innerHTML = `<h2>${esc(p.name)}</h2><div class="id">${p.id} · ${esc(p.kind)} · ${esc(p.area)}${p.vault ? " · vault " + esc(p.vault) : ""}</div>
    ${stats(p)}<div class="statement">${esc(p.statement)}</div>
    ${out.length ? `<h3>Rests on</h3><ul>${out.map(edge).join("")}</ul>` : ""}
    ${inn.length ? `<h3>Rests on it</h3><ul>${inn.map(edge).join("")}</ul>` : ""}
    <h3>Answers</h3>${answers(p.answers)}`;
  panel.classList.add("open");
  window.renderMathInElement?.(body, { delimiters: [{ left: "$$", right: "$$", display: true },
    { left: "$", right: "$", display: false }], throwOnError: false });
  if (centre) {
    const n = G.graphData().nodes.find(n => n.id === id);
    if (n) G.centerAt(n.x, n.y, 500);
  }
}

// a single lookup opens on its match; a refresh reopens what was open
const focused = Object.values(ideas).filter(n => n.focus);
if (KEPT) {
  if (KEPT.q) { q.value = KEPT.q; q.oninput(); }
  if (KEPT.selected) setTimeout(() => open(KEPT.selected), 50);
} else if (focused.length === 1) setTimeout(() => open(focused[0].id), 50);
addEventListener("resize", () => G.width(innerWidth).height(innerHeight));
</script>
</body>
</html>
