<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {  /* light; dark below, from the OS or the setting */
    --surface: #fcfcfb; --panel: #f3f2ee; --hair: rgba(11,11,11,0.10);
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --critical: #d03b3b; --unknown: #a3a29b; --link: 82,81,78;
  }
  :root[data-theme=dark] {
    --surface: #1a1a19; --panel: #222220; --hair: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --critical: #d03b3b; --unknown: #5f5e5a; --link: 200,199,190;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
    --surface: #1a1a19; --panel: #222220; --hair: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --critical: #d03b3b; --unknown: #5f5e5a; --link: 200,199,190;
  } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--surface); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  #graph { position: fixed; inset: 0; }

  /* the bar: search, counts, and three buttons */
  .bar { position: fixed; top: 12px; left: 12px; right: auto; max-width: calc(100% - 24px); z-index: 3;
    display: flex; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--hair); border-radius: 8px; padding: 5px 6px 5px 10px; }
  .bar input[type=search] { background: transparent; border: 0; outline: 0; min-width: 0; width: 200px; }
  .bar .count { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .icon { background: none; border: 0; color: var(--ink-2); cursor: pointer; padding: 3px; border-radius: 5px;
    display: grid; place-items: center; }
  .icon:hover { color: var(--ink); background: var(--hair); }
  .icon.on { color: var(--ink); background: var(--hair); }
  .icon svg { width: 16px; height: 16px; display: block; }
  @media (max-width: 560px) { .bar .count { display: none; } .bar input[type=search] { width: 100%; } }

  /* settings */
  .menu { position: fixed; top: 54px; left: 12px; z-index: 4; width: 260px; max-width: calc(100% - 24px);
    background: var(--panel); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 12px 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .menu h4 { margin: 8px 0 2px; font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; }
  .menu label { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 4px 0; color: var(--ink-2); cursor: pointer; }
  .menu label.check { justify-content: flex-start; }
  .menu input[type=range] { width: 120px; accent-color: var(--ink-2); }
  .menu input[type=checkbox] { accent-color: var(--ink-2); margin: 0; }
  .menu select { background: var(--surface); border: 1px solid var(--hair); border-radius: 5px; padding: 2px 4px; }
  .menu .reset { margin-top: 6px; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer;
    text-decoration: underline dotted; }

  /* the key, small and hideable */
  .legend { position: fixed; left: 12px; bottom: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--hair); border-radius: 8px; padding: 6px 8px 7px 10px; color: var(--ink-2);
    font-size: 12px; display: grid; grid-template-columns: auto auto; gap: 3px 8px; align-items: center; justify-items: start; }
  .legend .head { grid-column: 1 / -1; justify-self: stretch; display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 11px; }
  .legend .head .icon { padding: 0 2px; font-size: 14px; line-height: 1; }
  .legend .rrow { grid-column: 1 / -1; display: flex; gap: 8px; align-items: flex-start; }
  .legend .rrow > span { width: 22px; text-align: center; line-height: 9px; }
  .ramp { width: 84px; height: 7px; border-radius: 4px; }
  .ramp-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-left: 6px; }
  .keybtn { position: fixed; left: 12px; bottom: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--hair); border-radius: 8px; padding: 3px 9px; color: var(--ink-2); cursor: pointer; }
  .keybtn:hover { color: var(--ink); }

  /* the side panel */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--panel); z-index: 5;
    border-left: 1px solid var(--hair); padding: 18px 20px; overflow-y: auto;
    transform: translateX(100%); transition: transform .18s ease; }
  #panel.open { transform: none; }
  #panel h2 { font-size: 16px; margin: 0 0 2px; font-weight: 600; }
  .id { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  #panel .stats { display: flex; gap: 14px; margin: 12px 0; color: var(--ink-2); }
  #panel .stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  #panel .statement { margin: 10px 0 14px; font-size: 14px; }
  #panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 16px 0 6px; font-weight: 600; }
  #panel ul { list-style: none; margin: 0; padding: 0; }
  #panel li { padding: 4px 0; border-top: 1px solid var(--hair); color: var(--ink-2); }
  #panel li:first-child { border-top: 0; }
  a[data-id] { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--muted); cursor: pointer; }
  #panel .grade { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink); }
  #panel .mis { color: var(--critical); }
  #panel .close { position: absolute; top: 10px; right: 12px; background: none; border: 0;
    color: var(--muted); font-size: 18px; cursor: pointer; }
  .float-tooltip-kap { background: var(--panel) !important; color: var(--ink) !important;
    border: 1px solid var(--hair); border-radius: 6px !important; font: 12px/1.4 ui-sans-serif,
    system-ui, sans-serif !important; padding: 5px 8px !important; max-width: 320px; }

  /* the stats page */
  #stats { position: fixed; inset: 0; z-index: 1; overflow-y: auto; background: var(--surface);
    padding: 64px 16px 40px; clip-path: inset(56px 0 0 0); }
  .wrap { max-width: 980px; margin: 0 auto; }
  .wrap > header h1 { font-size: 18px; font-weight: 600; margin: 4px 0 0; }
  .sub { color: var(--muted); margin: 0; font-size: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
  .tile, .card { background: var(--panel); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; }
  .tile .label { color: var(--ink-2); font-size: 12px; }
  .tile .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0 0; }
  .tile .note { color: var(--muted); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
    gap: 10px; margin-top: 10px; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .plot { position: relative; height: 140px; margin: 14px 0 0 30px; }
  .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hair); }
  .gl span { position: absolute; right: 100%; margin-right: 6px; transform: translateY(-50%);
    color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .cols { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
  .col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center;
    border-radius: 4px 4px 0 0; cursor: default; }
  .col:hover { background: var(--hair); }
  .col .b { width: min(24px, 100%); border-radius: 4px 4px 0 0; }
  .cols .gap, .xlab .gap { flex: 0 0 12px; }
  .xlab { display: flex; gap: 2px; margin: 4px 0 0 30px; color: var(--muted); font-size: 11px; }
  .xlab .ends { display: flex; justify-content: space-between; }
  .tbl { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .tbl th { color: var(--muted); font-size: 11px; font-weight: 600; text-align: right; padding: 4px 6px; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl td { border-top: 1px solid var(--hair); padding: 5px 6px; text-align: right; color: var(--ink-2); }
  .tbl td:first-child { color: var(--ink); }
  .tbl td:not(:first-child) { white-space: nowrap; }
  .tbl tr[data-area], .tbl tr[data-id] { cursor: pointer; }
  .tbl tr[data-area]:hover td, .tbl tr[data-id]:hover td { background: var(--hair); }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
  .meter { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--hair);
    vertical-align: 1px; margin-left: 8px; overflow: hidden; }
  .meter span { display: block; height: 100%; border-radius: 3px; }
  @media (max-width: 560px) { .meter { display: none; } }
  .empty { color: var(--muted); margin: 10px 0 0; }
  #tip { position: fixed; z-index: 9; pointer-events: none; background: var(--panel); color: var(--ink);
    border: 1px solid var(--hair); border-radius: 6px; padding: 5px 8px; font-size: 12px; max-width: 260px;
    box-shadow: 0 4px 14px rgba(0,0,0,.1); }
</style>
</head>
<body>
<div id="graph"></div>

<div class="bar">
  <input type="search" id="q" placeholder="Search…" autocomplete="off">
  <span class="count" id="count"></span>
  <button class="icon" id="refresh" title="refresh from the model (r)" hidden>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.5h-2.5"/></svg></button>
  <button class="icon" id="statsbtn" title="stats (s)">
    <svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="8" width="3" height="6" rx="1"/><rect x="6.5" y="3" width="3" height="11" rx="1"/><rect x="11" y="6" width="3" height="8" rx="1"/></svg></button>
  <button class="icon" id="menubtn" title="settings">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.6" fill="var(--panel)"/><circle cx="11" cy="8" r="1.6" fill="var(--panel)"/><circle cx="7" cy="12" r="1.6" fill="var(--panel)"/></svg></button>
</div>

<div class="menu" id="menu" hidden>
  <h4>Nodes</h4>
  <label>Size <input type="range" id="s-size" min="0.4" max="2" step="0.1"></label>
  <label class="check"><input type="checkbox" id="s-links"> Bigger with more edges</label>
  <label>Labels <select id="s-labels"><option value="zoom">when zoomed in</option>
    <option value="always">always</option><option value="hover">on hover only</option></select></label>
  <label class="check"><input type="checkbox" id="s-orphans"> Unconnected ideas</label>
  <h4>Layout</h4>
  <label>Spacing <input type="range" id="s-spacing" min="0.6" max="2.2" step="0.1"></label>
  <label class="check"><input type="checkbox" id="s-areas"> Area shading</label>
  <label class="check"><input type="checkbox" id="s-arrows"> Arrows on edges</label>
  <h4>Page</h4>
  <label>Theme <select id="s-theme"><option value="system">system</option>
    <option value="light">light</option><option value="dark">dark</option></select></label>
  <label class="check"><input type="checkbox" id="s-legend"> Key</label>
  <button class="reset" id="reset">Reset to defaults</button>
</div>

<div class="legend" id="legend">
  <div class="head"><span>Key</span><button class="icon" id="hidekey" title="hide the key">×</button></div>
  <div class="rrow" title="the chance they recall it now"><span>R</span><div><div class="ramp" id="ramp"></div><div class="ramp-ends"><span>0</span><span>.5</span><span>1</span></div></div></div>
  <span class="dot" style="background:var(--unknown)"></span><span>never asked</span>
  <span class="dot" style="border:2px solid var(--critical)"></span><span title="their last answer showed a misconception">misconception</span>
  <span class="dot" style="border:2px solid var(--ink)" data-if="focus"></span><span data-if="focus">looked up</span>
  <svg width="22" height="10"><line x1="1" y1="5" x2="15" y2="5" stroke="var(--muted)" stroke-width="1.5"/><path d="M14 1 L21 5 L14 9 Z" fill="var(--muted)"/></svg><span title="the arrow points to the idea that cannot be followed without it">needs</span>
  <svg width="22" height="10"><line x1="1" y1="5" x2="15" y2="5" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M14 1 L21 5 L14 9 Z" fill="var(--muted)"/></svg><span title="the idea it points to carries it out">uses only</span>
  <span class="dot" style="border-radius:2px;background:var(--hair)" data-if="areas"></span><span data-if="areas" title="an area, split into faces for its subareas; areas never overlap">area</span>
</div>
<button class="keybtn" id="showkey" hidden>Key</button>

<aside id="panel"><button class="close" id="close">×</button><div id="body"></div></aside>

<section id="stats" hidden><div class="wrap" id="statsbody"></div></section>
<div id="tip" hidden></div>

<script>/*{{force-graph}}*/</script>
<script>
const DATA = /*{{data}}*/;
const $ = id => document.getElementById(id);

// a refresh reloads the page, which the server builds afresh from the model;
// the layout, view, search and open panel are carried across in sessionStorage
const KEPT = (() => { try { return JSON.parse(sessionStorage.getItem("kioku-kept")); }
                      catch { return null; } finally { try { sessionStorage.removeItem("kioku-kept"); } catch {} } })();

// -- settings, kept per browser
const DEFAULTS = { size: 1, links: true, labels: "zoom", orphans: true, spacing: 1,
                   areas: true, arrows: true, theme: "system", legend: true };
const S = (() => {
  const s = { ...DEFAULTS };
  try {  // older pages kept the theme and the shading under their own keys
    const t = localStorage.getItem("kioku-theme"); if (t) s.theme = t;
    if (localStorage.getItem("kioku-shade") === "0") s.areas = false;
    Object.assign(s, JSON.parse(localStorage.getItem("kioku-settings")) || {});
  } catch {}
  return s;
})();
const save = () => { try { localStorage.setItem("kioku-settings", JSON.stringify(S)); } catch {} };

// R → an ochre → green → teal → blue ramp, faint to strong against the surface.
// Half of it goes to R .5–.7 and .7–1 each, where the distinctions matter, so
// .8, .9 and .95 read as different hues as well as lightnesses. Stops are
// OKLCH [R, L, C, h], blended in OKLab; lightness is monotone, so order
// survives colour-blindness and greyscale.
const STOPS = {
  light: [[0, .78, .09, 85], [.5, .74, .13, 125], [.7, .65, .12, 165], [.8, .59, .10, 195],
          [.9, .51, .11, 240], [1, .39, .13, 275]],
  dark: [[0, .42, .07, 85], [.5, .52, .11, 125], [.7, .62, .12, 165], [.8, .69, .10, 195],
         [.9, .78, .095, 235], [1, .87, .065, 280]],
};
function oklab(stops, r) {
  let i = 0; while (i < stops.length - 2 && r > stops[i + 1][0]) i++;
  const [r0, ...p] = stops[i], [r1, ...q] = stops[i + 1], t = (r - r0) / (r1 - r0);
  const ab = ([L, C, h]) => [L, C * Math.cos(h * Math.PI / 180), C * Math.sin(h * Math.PI / 180)];
  const A = ab(p), B = ab(q);
  return A.map((v, k) => v + (B[k] - v) * t);
}
function hex([L, a, b]) {
  const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3,
        s = (L - .0894841775 * a - 1.2914855480 * b) ** 3;
  return "#" + [4.0767416621 * l - 3.3077115913 * m + .2309699292 * s,
                -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s,
                -.0041960863 * l - .7034186147 * m + 1.7076147010 * s].map(v => {
    v = Math.max(0, Math.min(1, v)); v = v <= .0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - .055;
    return Math.round(v * 255).toString(16).padStart(2, "0"); }).join("");
}
const dark = matchMedia("(prefers-color-scheme: dark)");
let T = {}, RAMP = [];
function theme() {
  if (S.theme === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = S.theme;
  const mode = T.mode = S.theme === "system" ? (dark.matches ? "dark" : "light") : S.theme;
  const css = getComputedStyle(document.documentElement);
  for (const k of ["surface", "ink", "ink-2", "critical", "unknown", "link"])
    T[k] = css.getPropertyValue("--" + k).trim();
  RAMP = Array.from({ length: 101 }, (_, i) => hex(oklab(STOPS[mode], i / 100)));  // R in hundredths
  $("ramp").style.background = `linear-gradient(90deg, ${RAMP.filter((_, i) => i % 5 === 0).join(",")})`;
  if (window.G) G.backgroundColor(T.surface);
  if (!$("stats").hidden) renderStats();
}
theme();
dark.addEventListener("change", theme);
const C = k => T[k.replace(/^--/, "")];
const colourOf = r => r == null ? T.unknown : RAMP[Math.round(Math.max(0, Math.min(1, r)) * 100)];

const fmtR = r => r == null ? "–" : r >= 1 ? "1" : (Math.floor(r * 100) / 100).toFixed(2).replace(/^0/, "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const idOf = x => typeof x === "object" ? x.id : x;

// links run from the idea needed or used to the idea that needs or uses it, so
// what an idea rests on sits above it
const ideas = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const nbrs = {};
for (const l of DATA.links) {
  (nbrs[l.source] ??= new Set()).add(l.target); (nbrs[l.target] ??= new Set()).add(l.source);
}
const degree = id => (nbrs[id]?.size ?? 0);
const markOf = l => l.needs && l.uses ? "needs and uses" : l.needs ? "needs" : "uses";
const asked = n => n.answers.some(a => a.flag !== "pre");

// -- areas are a map. Each top area is one blob (the rounded outline of its
// ideas), and its subareas split it into faces with nothing left over, as do
// theirs in turn. Where two pieces of ground meet is decided by a power
// diagram of their ideas' centres, weighted by size so a big area is not cut by
// a small neighbour; ideas sitting directly in an area with subareas get a face
// of their own. A force keeps every idea on its face and each area compact.
const chain = a => a.split("/").map((_, i, p) => p.slice(0, i + 1).join("/"));
const inArea = (n, a) => n.area === a || n.area.startsWith(a + "/");
const AREAS = [...new Set(DATA.nodes.flatMap(n => chain(n.area)))]
  .sort((a, b) => a.split("/").length - b.split("/").length || a.localeCompare(b));
const TOPS = [...new Set(AREAS.map(a => a.split("/")[0]))];
// a subarea's hue sits near its parent's, its siblings spread either side
const HUE = {};
for (const a of AREAS) {
  const p = a.split("/"), up = p.slice(0, -1).join("/");
  if (p.length === 1) { HUE[a] = 25 + 360 * TOPS.indexOf(a) / TOPS.length; continue; }
  const sibs = AREAS.filter(b => b.startsWith(up + "/") && b.split("/").length === p.length), i = sibs.indexOf(a);
  HUE[a] = HUE[up] + (sibs.length > 1 ? (i / (sibs.length - 1) - .5) * 44 / (p.length - 1) : 0);
}
function areaColour(a, alpha, ink) {
  const h = (HUE[a] ?? HUE[a.split("/")[0]]) * Math.PI / 180;
  const [L, C] = ink ? (T.mode === "dark" ? [.78, .09] : [.48, .1]) : (T.mode === "dark" ? [.62, .08] : [.7, .1]);
  return hexA(hex([L, C * Math.cos(h), C * Math.sin(h)]), alpha);
}
function hull(pts) {  // monotone chain
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const x = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length > 1 && x(lo.at(-2), lo.at(-1), p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()) { while (up.length > 1 && x(up.at(-2), up.at(-1), p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function smooth(poly) {  // Chaikin, twice: every corner cut, so the hull reads as a blob
  for (let t = 0; t < 2; t++) poly = poly.flatMap((p, i) => { const q = poly[(i + 1) % poly.length];
    return [[.75 * p[0] + .25 * q[0], .75 * p[1] + .25 * q[1]], [.25 * p[0] + .75 * q[0], .25 * p[1] + .75 * q[1]]]; });
  return poly;
}
const RING = Array.from({ length: 12 }, (_, i) => [Math.cos(i * Math.PI / 6), Math.sin(i * Math.PI / 6)]);
const LEVELS = Math.max(1, ...AREAS.map(a => a.split("/").length));
// an idea's group at level k: its area there, or "area/" for an idea sitting
// directly in an area with subareas
const keyAt = (area, k) => { const p = area.split("/");
  return k < p.length ? p.slice(0, k + 1).join("/") : area + "/"; };
function sites(ns) {

  input.oninput = () => {
    S[k] = input.type === "checkbox" ? input.checked : input.type === "range" ? +input.value : input.value;
    save(); APPLY[k]();
  };
}
$("reset").onclick = () => {
  const was = { ...S };
  Object.assign(S, DEFAULTS); save(); sync();
  for (const k of Object.keys(DEFAULTS)) if (was[k] !== S[k]) APPLY[k]();
};
$("hidekey").onclick = () => { S.legend = false; save(); sync(); key(); };
$("showkey").onclick = () => { S.legend = true; save(); sync(); key(); };
sync(); key();

// -- search lights matches and their neighbours; Enter centres on the first.
// `area:name` matches the ideas in that area and the areas inside it.
const hay = n => [n.id, n.name, n.statement, n.area, ...(n.aliases || [])].join(" ").toLowerCase();
const matches = (n, w) => w.startsWith("area:") ? inArea({ area: n.area.toLowerCase() }, w.slice(5)) : hay(n).includes(w);
q.oninput = () => {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = words.length ? Object.values(ideas).filter(n => words.every(w => matches(n, w))) : [];
  light(words.length ? new Set(hits.map(n => n.id).concat(hits.length ? [] : ["-"])) : null);
};
q.onkeydown = e => {
  if (e.key === "Enter" && lit) {
    if (!$("stats").hidden) go("");
    const n = G.graphData().nodes.find(n => lit.has(n.id));
    if (n) { G.centerAt(n.x, n.y, 500); G.zoom(3, 500); open(n.id); }
  }
  if (e.key === "Escape") { q.value = ""; light(null); }
};

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || ["INPUT", "SELECT"].includes(e.target.tagName)) return;
  if (e.key === "r") reload();
  if (e.key === "s") go($("stats").hidden ? "stats" : "");
  if (e.key === "Escape") { menu.hidden = true; close(); }
});

// -- the side panel
const panel = $("panel"), body = $("body");
$("close").onclick = close;
function close() { selected = null; panel.classList.remove("open"); }
const link = id => `<a data-id="${id}">${esc(ideas[id]?.name ?? id)}</a>`;
body.onclick = e => { const id = e.target.dataset?.id; if (id) open(id, true); };

function answers(list) {
  if (!list.length) return `<p style="color:var(--muted)">No answers yet.</p>`;
  return `<ul>${list.slice().reverse().map(a =>
    `<li><span class="grade">${a.at} ${esc(a.outcome === "unmet" ? "never met" : a.outcome)}${a.help ? " · " + esc(a.help) : ""}${a.conf != null ? " · " + a.conf : ""}</span>
     ${a.flag === "mis" ? '<span class="mis">misconception</span>' : a.flag === "pre" ? "before teaching" : a.taught ? "after teaching" : a.probe ? "probe" : ""}
     <span class="id">${esc(a.kind)}${a.depth ? " · " + esc(a.depth) : ""} ${esc(a.ask)}</span><br>${esc(a.note)}</li>`).join("")}</ul>`;
}
function stats(x) {
  const s = x.stability == null ? "–" : x.stability < 10 ? x.stability.toFixed(1) : Math.round(x.stability);
  return `<div class="stats"><span>R <b>${fmtR(x.r)}</b></span><span>stability <b>${s}</b> d</span>
          <span>answers <b>${x.n}</b></span></div>`;
}

function open(id, centre) {
  const p = ideas[id];
  if (!p) return;
  selected = id;
  const edge = l => `<li>${link(l.other)} <span class="id">${markOf(l)} · R ${fmtR(ideas[l.other]?.r)}</span></li>`;
  const out = DATA.links.filter(l => l.target === id).map(l => ({ ...l, other: l.source }));
  const inn = DATA.links.filter(l => l.source === id).map(l => ({ ...l, other: l.target }));
  body.innerHTML = `<h2>${esc(p.name)}</h2><div class="id">${p.id} · ${esc(p.kind)} · ${esc(p.area)}${p.vault ? " · vault " + esc(p.vault) : ""}</div>
    ${stats(p)}<div class="statement">${esc(p.statement)}</div>
    ${out.length ? `<h3>Rests on</h3><ul>${out.map(edge).join("")}</ul>` : ""}
    ${inn.length ? `<h3>Rests on it</h3><ul>${inn.map(edge).join("")}</ul>` : ""}
    <h3>Answers</h3>${answers(p.answers)}`;
  panel.classList.add("open");
  window.renderMathInElement?.(body, { delimiters: [{ left: "$$", right: "$$", display: true },
    { left: "$", right: "$", display: false }], throwOnError: false });
  if (centre) {
    const n = G.graphData().nodes.find(n => n.id === id);
    if (n) G.centerAt(n.x, n.y, 500);
  }
}

// -- the stats page (#stats): the model in numbers, every idea and area a way back into the graph
const statsEl = $("stats");
function go(where) {
  if (where) location.hash = where;
  else history.replaceState(null, "", location.pathname + location.search);
  route();
}
function route() {
  const on = location.hash === "#stats";
  statsEl.hidden = !on;
  $("statsbtn").classList.toggle("on", on);
  menu.hidden = true; $("menubtn").classList.remove("on");
  if (on) { close(); renderStats(); G.pauseAnimation(); } else G.resumeAnimation();
  key();
}
addEventListener("hashchange", route);
$("statsbtn").onclick = () => go(statsEl.hidden ? "stats" : "");

const when = s => new Date(s.replace(" ", "T"));
const DAY = 864e5;
const nice = v => v.toLocaleString();
const mean = xs => xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null;

function ticks(max) {  // round steps for an axis of counts
  if (max <= 0) return [0, 1];
  const raw = max / 3, p = 10 ** Math.floor(Math.log10(raw));
  const step = Math.max(1, [1, 2, 5, 10].map(k => k * p).find(s => s >= raw));
  const out = [0];
  while (out.at(-1) < max) out.push(out.at(-1) + step);
  return out;
}
// a column chart in plain HTML: groups of columns (a gap between groups), a
// tooltip on every column, x labels under each group
function columns(groups) {
  const top = ticks(Math.max(...groups.flatMap(g => g.cols.map(c => c.value)))).at(-1);
  const grid = ticks(top).map(v => `<div class="gl" style="bottom:${v / top * 100}%"><span>${v}</span></div>`).join("");
  const cols = groups.map(g => g.cols.map(c =>
    `<div class="col" data-tip="${esc(c.tip)}"><div class="b" style="height:${c.value / top * 100}%;background:${c.colour}"></div></div>`).join(""))
    .join(`<div class="gap"></div>`);
  const xlab = groups.map(g => `<div class="ends" style="flex:${g.cols.length}">${g.labels.map(l => `<span>${esc(l)}</span>`).join("")}</div>`)
    .join(`<div class="gap"></div>`);
  return `<div class="plot">${grid}<div class="cols">${cols}</div></div><div class="xlab">${xlab}</div>`;
}
const tile = (label, value, note) =>
  `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div><div class="note">${note}</div></div>`;
const meter = r => r == null ? "" : `<span class="meter"><span style="width:${r * 100}%;background:${colourOf(r)}"></span></span>`;

function renderStats() {
  const ns = DATA.nodes, now = when(DATA.now);
  const all = ns.flatMap(n => n.answers.map(a => ({ ...a, t: when(a.at) })));
  const ask = ns.filter(asked), withR = ns.filter(n => n.r != null);
  const week = all.filter(a => now - a.t < 7 * DAY).length;
  const mis = ns.filter(n => n.mis);
  const scoped = ns.some(n => n.focus);

  // recall now: asked ideas in tenths of R, and the ideas never asked beside them
  const bins = Array.from({ length: 10 }, (_, i) => withR.filter(n => Math.min(9, Math.floor(n.r * 10)) === i));
  const never = ns.length - withR.length;
  const rChart = columns([
    { cols: bins.map((b, i) => ({ value: b.length, colour: colourOf(i / 10 + .05),
        tip: `<b>${b.length}</b> ideas with R ${fmtR(i / 10)}–${fmtR((i + 1) / 10)}` })), labels: ["R 0", ".5", "1"] },
    { cols: [{ value: never, colour: T.unknown, tip: `<b>${never}</b> ideas with no graded answer` }], labels: ["none"] },
  ]);

  // answers over time: per day for a month or less, else per week (the last 26)
  let aChart = `<p class="empty">No answers yet.</p>`, per = "week";
  if (all.length) {
    const first = new Date(Math.min(...all.map(a => a.t)));
    per = now - first <= 31 * DAY ? "day" : "week";
    const start = d => { const x = new Date(d); x.setHours(0, 0, 0, 0);
      if (per === "week") x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
    const slots = [];
    for (let d = start(first); d <= now; d.setDate(d.getDate() + (per === "week" ? 7 : 1))) slots.push(new Date(d));
    const shown = slots.slice(-26);
    const count = new Map(shown.map(d => [+d, []]));
    for (const a of all) count.get(+start(a.t))?.push(a);
    const day = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    aChart = columns([{ cols: shown.map(d => { const as = count.get(+d);
        const by = ["right", "partly", "wrong", "unmet", "guess"].map(g => [g, as.filter(a => a.outcome === g).length]).filter(([, k]) => k);
        return { value: as.length, colour: T["ink-2"],
          tip: `${per === "week" ? "Week of " : ""}${day(d)}<br><b>${as.length}</b> answers${by.length ? "<br>" + by.map(([g, k]) => `${g} ${k}`).join(" · ") : ""}` }; }),
      labels: shown.length > 1 ? [day(shown[0]), per === "week" ? "this week" : "today"] : [day(shown[0])] }]);
  }
  const depths = ["state", "use", "transfer"].map(d => [d, all.filter(a => a.depth === d).length]).filter(([, k]) => k);

  // areas, as a tree: an area counts its subareas' ideas too
  const parts = a => a.split("/");
  const tree = AREAS.slice().sort((a, b) => { const p = parts(a), q = parts(b);
    for (let i = 0; i < Math.min(p.length, q.length); i++) if (p[i] !== q[i]) return p[i].localeCompare(q[i]);
    return p.length - q.length; });
  const row = (label, inside, attr, swatch) => { const k = inside.filter(asked).length, r = mean(inside.filter(n => n.r != null).map(n => n.r));
    return `<tr ${attr}><td>${swatch ?? ""}${label}</td><td>${inside.length}</td><td>${k}</td><td>${fmtR(r)}${meter(r)}</td></tr>`; };
  const areas = tree.map(a => { const level = parts(a).length - 1;
    return row(`<span style="padding-left:${level * 14}px"></span>${esc(parts(a).at(-1))}`, ns.filter(n => inArea(n, a)),
      `data-area="${esc(a)}" title="show ${esc(a)} in the graph"`, level ? "" : `<span class="sw" style="background:${areaColour(a, 1)}"></span>`); }).join("");
  const kinds = [...new Set(ns.map(n => n.kind))].sort().map(k => row(esc(k), ns.filter(n => n.kind === k), "")).join("");
  const head = first => `<tr><th>${first}</th><th>ideas</th><th>asked</th><th>mean R</th></tr>`;

  // the asked ideas with the lowest R now
  const lastAt = n => n.answers.at(-1)?.at ?? "";  // among equal R, the latest answer first
  const low = withR.slice().sort((a, b) => a.r - b.r || lastAt(b).localeCompare(lastAt(a))).slice(0, 10).map(n =>
    `<tr data-id="${n.id}"><td>${esc(n.name)}<div class="id">${esc(n.area)}${n.mis ? ' · <span style="color:var(--critical)">misconception</span>' : ""}</div></td>
     <td>${fmtR(n.r)}${meter(n.r)}</td></tr>`).join("");

  $("statsbody").innerHTML = `
    <header><h1>${scoped ? "These ideas" : "The model"} in numbers</h1>
      <p class="sub">as of ${esc(DATA.now)}${scoped ? ` · the ${ns.length} ideas this page was opened on` : ""}</p></header>
    <div class="tiles">
      ${tile("Ideas", nice(ns.length), `in ${AREAS.length} areas · ${nice(DATA.links.length)} edges`)}
      ${tile("Asked", ns.length ? Math.round(100 * ask.length / ns.length) + "%" : "–", `${nice(ask.length)} ideas with an answer`)}
      ${tile("Mean recall", fmtR(mean(withR.map(n => n.r))), `R now, over ${nice(withR.length)} ideas`)}
      ${tile("Answers", nice(all.length), `${nice(week)} in the last 7 days`)}
      ${tile("Misconceptions", nice(mis.length), "ideas whose last answer was one")}
    </div>
    <div class="cards">
      <div class="card"><h2>Recall now</h2><p class="sub">ideas by R today</p>${rChart}</div>
      <div class="card"><h2>Answers per ${per}</h2><p class="sub">${depths.length ? "by depth: " + depths.map(([d, k]) => `${d} ${k}`).join(" · ") : "every answer and observed step"}</p>${aChart}</div>
      <div class="card wide"><h2>Areas</h2><p class="sub">an area counts the areas inside it; click one to see it in the graph</p>
        <table class="tbl">${head("area")}${areas}</table></div>
      <div class="card"><h2>Lowest recall</h2><p class="sub">asked ideas, lowest R first</p>
        ${low ? `<table class="tbl"><tr><th>idea</th><th>R</th></tr>${low}</table>` : `<p class="empty">Nothing asked yet.</p>`}</div>
      <div class="card"><h2>Kinds</h2><p class="sub">what the ideas are</p><table class="tbl">${head("kind")}${kinds}</table></div>
    </div>`;
}
statsEl.addEventListener("click", e => {
  const tr = e.target.closest("tr");
  if (tr?.dataset.area) {
    go(""); q.value = "area:" + tr.dataset.area; q.oninput();
    setTimeout(() => G.zoomToFit(500, 80, n => lit?.has(n.id)), 30);
  } else if (tr?.dataset.id) {
    const id = tr.dataset.id; go("");
    const n = G.graphData().nodes.find(n => n.id === id);
    if (n) { G.centerAt(n.x, n.y, 500); G.zoom(3, 500); }
    open(id);
  }
});
const tip = $("tip");
statsEl.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 12) + "px";
  tip.style.top = Math.max(8, e.clientY - h - 10) + "px";
});
statsEl.addEventListener("mouseleave", () => { tip.hidden = true; });

// a single lookup opens on its match; a refresh reopens what was open
const focused = Object.values(ideas).filter(n => n.focus);
if (KEPT) {
  if (KEPT.q) { q.value = KEPT.q; q.oninput(); }
  if (KEPT.selected) setTimeout(() => open(KEPT.selected), 50);
} else if (focused.length === 1) setTimeout(() => open(focused[0].id), 50);
route();
addEventListener("resize", () => G.width(innerWidth).height(innerHeight));
</script>
</body>
</html>
