[project]
name = "reader"
version = "0.1.0"
description = "A learner model for agents: what a reader has shown they know, as recall probabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reader = "reader.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reader"]
