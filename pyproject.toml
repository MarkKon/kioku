[project]
name = "kioku"
version = "0.1.0"
description = "A memory model of the person an agent works with: what they have shown they know, as recall probabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kioku = "kioku.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kioku"]
